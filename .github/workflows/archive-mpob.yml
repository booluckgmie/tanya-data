name: Archive MPOB daily prices

# MPOB serves only the last three years of daily crude palm oil prices. This keeps a permanent copy
# in archive/mpob/ before a year rolls off. It runs weekly, and can be started by hand from the
# Actions tab. GitHub runs scheduled workflows only from the default branch.
on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and parse MPOB price files
        run: python3 harvest/archive_mpob.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/mpob
          if git diff --cached --quiet; then
            echo "No change in the archived prices."
          else
            git commit -m "Archive MPOB daily CPO prices"
            git push
          fi
